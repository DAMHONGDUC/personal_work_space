name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Generate the CV LaTeX
        run: npm run cv:tex

      - name: Compile the CV
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: cv/build
          root_file: main.tex

      - name: Publish the CV
        # public/ is copied into the export, so the PDF and the page images have
        # to land before the site build runs. The images are what /personal/cv
        # renders inline; the PDF is the download.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          cp cv/build/main.pdf public/cv.pdf
          node scripts/build-cv-images.mts

      - name: Build static export
        # A project site is served from /<repo>, so the app needs that prefix.
        # A custom domain serves from the root, so leave it empty there.
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
